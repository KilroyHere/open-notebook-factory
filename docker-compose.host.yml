# Host this repository on your own machine.
#
# From the repository root:
#   docker compose -f docker-compose.host.yml up --build
#
# UI:  http://localhost:8502
# API: http://localhost:5055
#
# One container runs SurrealDB, the API, the worker, and the web UI.
# Ports are bound to this machine only. Replace the encryption key before
# you save real provider credentials.

name: open-notebook-local

services:
  open_notebook:
    build:
      context: .
      dockerfile: Dockerfile
      target: single
    ports:
      - "127.0.0.1:8502:8502"
      - "127.0.0.1:5055:5055"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=change-me-to-a-secret-string
      - SURREAL_URL=ws://localhost:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
    volumes:
      - ./notebook_data:/app/data
      - ./surreal_single_data:/mydata
    restart: unless-stopped
